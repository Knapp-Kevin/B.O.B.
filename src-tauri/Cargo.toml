[package]
name = "bob"
version = "0.0.1"
description = "B.O.B. | Better Organized Brain"
authors = ["Kevin Knapp"]
edition = "2021"

[lib]
name = "bob_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
